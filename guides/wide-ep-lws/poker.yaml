# 1. The Storage Request (PVC)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guide-llm 
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi # Change this size if needed


---


# poker/values.yaml
apiVersion: v1
kind: Pod
metadata:
  name: poker
  labels:
    app: poker

spec:
  restartPolicy: Never
  tolerations:
  # (varun) This allows the pod to be placed in a node with
  # a GPU. If I dont do this, then kubernetes can't find machine.
  # Maybe there is a better way.
  - key: "amd.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

  containers:
    - name: poker
      image: quay.io/tms/poker:0.0.10
      imagePullPolicy: Always
      stdin: true
      tty: true
      securityContext:
        privileged: true # for ulimit setting
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
              optional: true

      volumeMounts:
        - name: guide-llm
          mountPath: /guide-llm

  volumes:
    - name: guide-llm
      persistentVolumeClaim:
        claimName: guide-llm
